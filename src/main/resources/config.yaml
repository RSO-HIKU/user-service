kumuluzee:
  name: user-service
  version: 0.1.0
  env:
    name: ${KUMULUZEE_ENV_NAME:dev}
  server:
    http:
      port: ${KUMULUZEE_SERVER_HTTP_PORT:8083}
      address: ${KUMULUZEE_SERVER_HTTP_ADDRESS:0.0.0.0}
  datasources:
    - jndi-name: jdbc/HikuDS
      connection-url: ${KUMULUZEE_DATASOURCES_DEFAULT_CONNECTIONURL:jdbc:postgresql://localhost:5432/hikudb}
      username: ${KUMULUZEE_DATASOURCES_DEFAULT_USERNAME}
      password: ${KUMULUZEE_DATASOURCES_DEFAULT_PASSWORD:hikupassword}
      # HikariCP-specific pool settings
      hikari:
        minimum-idle: ${KUMULUZEE_DATASOURCES_DEFAULT_HIKARI_MINIMUM_IDLE:1}
        maximum-pool-size: ${KUMULUZEE_DATASOURCES_DEFAULT_HIKARI_MAXIMUM_POOL_SIZE:3}
  jwt-auth:
    issuer: ${KUMULUZEE_JWT_AUTH_ISSUER}
    jwks-uri: ${KUMULUZEE_JWT_AUTH_JWKS_URI}
